name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: NppPrintPreview
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release]
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      

    - name: Build of plugin dll Release via scripts
      working-directory: .\
      run: |
           .\build.ps1

    - name: Archive artifacts for ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
          name: ${{ env.Projectname }}-${{ matrix.build_platform }}
          path: ./build/${{ matrix.build_platform }}/${{ env.Projectname }}.dll

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: ${{ env.Projectname }}-${{ matrix.build_platform }}.zip